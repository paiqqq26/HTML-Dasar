<!DOCTYPE html>
<html>
    <head>
        <title>Form Registrasi</title>
    </head>
    <body>
        <h1>Form Registrasi</h1>
        <form>
            <fieldset>
                <legend>Biodata</legend>
                <table>
                    <tr>
                        <td>Nama</td>
                        <td>: <input type="text" placeholder="Masukkan Nama"></td>
                    </tr>
                    <tr>
                        <td>Nomor Induk Mahasiswa (NIM)</td>
                        <td>: <input type="text" placeholder="Masukkan NIM"></td>
                    </tr>
                    <tr>
                        <td>Alamat Mahasiswa</td>
                        <td><textarea placeholder="Masukkan Alamat" rows="5" cols="50"></textarea></tr>
                    </tr>
                    <tr>
                        <td>Tanggal Lahir</td>
                        <td>:
                            <select>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                                <option value="17">17</option>
                                <option value="18">18</option>
                                <option value="19">19</option>
                                <option value="20">20</option>
                                <option value="21">21</option>
                                <option value="22">22</option>
                                <option value="23">23</option>
                                <option value="24">24</option>
                                <option value="25">25</option>
                                <option value="26">26</option>
                                <option value="27">27</option>
                                <option value="28">28</option>
                                <option value="29">29</option>
                                <option value="30">30</option>
                                <option value="31">31</option>
                            </select>
                            
                            <select>
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>    
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>

                            <select>
                                <option value="1995">1995</option>
                                <option value="1996">1996</option>
                                <option value="1997">1997</option>
                                <option value="1998">1998</option>
                                <option value="1999">1999</option>
                                <option value="2000">2000</option>
                                <option value="2001">2001</option>
                                <option value="2002">2002</option>
                                <option value="2003">2003</option>
                                <option value="2004">2004</option>
                                <option value="2005">2005</option>
                                <option value="2006">2006</option>
                                <option value="2007">2007</option>
                                <option value="2008">2008</option>
                                <option value="2009">2009</option>
                                <option value="2010">2010</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>
                            :
                            <input type="radio" name="jk" id="Pria"> <label for="Pria">Pria</label>
                            <input type="radio" name="jk" id="Wanita"> <label for="Wanita">Wanita</label>
                        </td>
                    </tr>
                    <tr>
                        <td>Upload Foto</td>
                        <td>: <input type="file"></td>
                    </tr>
                    <tr>
                        <td>URL Website</td>
                        <td>: <input type="text" placeholder="URL Website Anda"></td>
                    </tr>
                    <tr>
                        <td>Perguruan Tinggi</td>
                        <td>: <input type="text"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Info Akun</legend>
                <table>
                    <tr>
                        <td>Email</td>
                        <td>: <input type="email" placeholder="Email Anda"></td>
                    </tr>
                    <tr>
                        <td>Username</td>
                        <td>: <input type="text" placeholder="Username Anda"></td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td>: <input type="Password" placeholder="Password Anda"></td>
                    </tr>
                    <tr>
                        <td>Ulangi Password</td>
                        <td>: <input type="Password" placeholder="Password Anda"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Kemampuan Dasar</legend>
                <div style="padding: 5px 0;">
                    <input type="checkbox" id="html"> <label for="html">HTML</label>
                    <input type="checkbox" id="css"> <label for="css">CSS</label>
                    <input type="checkbox" id="js"> <label for="js">JavaScript</label>
                    <input type="checkbox" id="php"> <label for="php">PHP</label>
                    <input type="checkbox" id="mysql"> <label for="mysql">MySQL</label>
                    <input type="checkbox" id="laravel"> <label for="laravel">Laravel</label>
                    <input type="checkbox" id="react"> <label for="react">React Native</label>
                </div>
            </fieldset>

            <br>

            <button type="reset">Reset</button>
            <button type="submit">Simpan</button>
            <button type="button">Button</button>
        </form>
    </body>
</html>
